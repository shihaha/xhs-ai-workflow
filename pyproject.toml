[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xhs-intelligence-workbench"
version = "0.1.0"
description = "A truthful, Windows-local Xiaohongshu intelligence workbench."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "adbutils>=2,<3",
    "fastapi>=0.115,<1",
    "pillow>=12,<13",
    "playwright>=1.61,<2",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "uiautomator2>=3,<4",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
]
