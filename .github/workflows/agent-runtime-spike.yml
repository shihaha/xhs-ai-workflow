name: Agent Runtime Spike Verification

on:
  push:
    branches:
      - spike/agent-runtime-pydantic-v1
  pull_request:
  workflow_dispatch:

env:
  PYTHONPATH: .

jobs:
  baseline-backend:
    name: Existing baseline backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/xhs-workbench-next
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install baseline dependencies
        run: |
          python - <<'PY'
          import subprocess, sys, tomllib
          with open('pyproject.toml', 'rb') as handle:
              project = tomllib.load(handle)
          deps = project['project']['dependencies'] + project['project']['optional-dependencies']['dev']
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *deps])
          PY
      - name: Run baseline backend tests
        run: python -m pytest -q

  spike-backend:
    name: Spike backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install spike dependencies
        run: |
          python - <<'PY'
          import subprocess, sys, tomllib
          with open('pyproject.toml', 'rb') as handle:
              project = tomllib.load(handle)
          deps = project['project']['dependencies'] + project['project']['optional-dependencies']['dev']
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *deps])
          PY
      - name: Run agent runtime tests
        run: python -m pytest backend/tests/agent_runtime -q
      - name: Run full backend tests
        run: python -m pytest -q

  baseline-frontend:
    name: Existing baseline frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/xhs-workbench-next
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install baseline frontend dependencies
        run: npm ci
      - name: Run baseline frontend tests
        run: npm test -- --run
      - name: Build baseline frontend
        run: npm run build

  spike-frontend:
    name: Spike frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install spike frontend dependencies
        run: npm ci
      - name: Run spike frontend tests
        run: npm test -- --run
      - name: Build spike frontend
        run: npm run build
