name: Agent Runtime Spike Verification

on:
  pull_request:
  workflow_dispatch:

env:
  PYTHONPATH: .

jobs:
  baseline-backend:
    name: Capture baseline backend failures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/xhs-workbench-next
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install baseline dependencies
        run: |
          python - <<'PY'
          import subprocess, sys, tomllib
          with open('pyproject.toml', 'rb') as handle:
              project = tomllib.load(handle)
          deps = project['project']['dependencies'] + project['project']['optional-dependencies']['dev']
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *deps])
          PY
      - name: Capture baseline backend result
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=no > pytest.log 2>&1
          status=$?
          set -e
          cat pytest.log
          python - "$status" <<'PY'
          import json
          import pathlib
          import re
          import sys

          status = int(sys.argv[1])
          text = pathlib.Path('pytest.log').read_text(encoding='utf-8', errors='replace')
          issues = sorted({
              match.group(1)
              for line in text.splitlines()
              if (match := re.match(r'^(?:FAILED|ERROR)\s+([^\s]+)', line))
          })
          pathlib.Path('backend-result.json').write_text(
              json.dumps({'exit_code': status, 'issues': issues}, indent=2, ensure_ascii=False),
              encoding='utf-8',
          )
          print(f'baseline backend: exit={status}, issues={len(issues)}')
          if status not in (0, 1):
              raise SystemExit(f'pytest infrastructure/collection failure: exit {status}')
          if status == 1 and not issues:
              raise SystemExit('pytest failed but no FAILED/ERROR node ids could be extracted')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-backend-result
          path: backend-result.json

  spike-backend:
    name: Capture spike backend failures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install spike dependencies
        run: |
          python - <<'PY'
          import subprocess, sys, tomllib
          with open('pyproject.toml', 'rb') as handle:
              project = tomllib.load(handle)
          deps = project['project']['dependencies'] + project['project']['optional-dependencies']['dev']
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *deps])
          PY
      - name: Run Agent Runtime acceptance tests
        run: python -m pytest backend/tests/agent_runtime -q
      - name: Capture spike full-backend result
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=no > pytest.log 2>&1
          status=$?
          set -e
          cat pytest.log
          python - "$status" <<'PY'
          import json
          import pathlib
          import re
          import sys

          status = int(sys.argv[1])
          text = pathlib.Path('pytest.log').read_text(encoding='utf-8', errors='replace')
          issues = sorted({
              match.group(1)
              for line in text.splitlines()
              if (match := re.match(r'^(?:FAILED|ERROR)\s+([^\s]+)', line))
          })
          pathlib.Path('backend-result.json').write_text(
              json.dumps({'exit_code': status, 'issues': issues}, indent=2, ensure_ascii=False),
              encoding='utf-8',
          )
          print(f'spike backend: exit={status}, issues={len(issues)}')
          if status not in (0, 1):
              raise SystemExit(f'pytest infrastructure/collection failure: exit {status}')
          if status == 1 and not issues:
              raise SystemExit('pytest failed but no FAILED/ERROR node ids could be extracted')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: spike-backend-result
          path: backend-result.json

  backend-regression-guard:
    name: Backend regression guard
    needs: [baseline-backend, spike-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: baseline-backend-result
          path: .ci/baseline
      - uses: actions/download-artifact@v4
        with:
          name: spike-backend-result
          path: .ci/spike
      - name: Compare and recheck apparent regressions
        run: |
          python tools/agent_runtime_regression_guard.py \
            --baseline-result .ci/baseline/backend-result.json \
            --spike-result .ci/spike/backend-result.json \
            --baseline-ref research/xhs-workbench-next \
            --repeats 5 \
            --report backend-regression-recheck.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-regression-recheck
          path: backend-regression-recheck.json
          if-no-files-found: warn

  baseline-frontend:
    name: Existing baseline frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/xhs-workbench-next
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install baseline frontend dependencies
        run: npm ci
      - name: Run baseline frontend tests
        run: npm test -- --run
      - name: Build baseline frontend
        run: npm run build

  spike-frontend:
    name: Spike frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install spike frontend dependencies
        run: npm ci
      - name: Run spike frontend tests
        run: npm test -- --run
      - name: Build spike frontend
        run: npm run build

  spike-static:
    name: Spike compile and boundary checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q backend tools frontend/e2e/fixture_app.py
      - name: Scan release boundaries
        run: python tools/scan_release_boundaries.py --root .
      - name: Scan tracked files for secret-shaped values
        shell: bash
        run: |
          if git grep -n -I -E '(sk-[A-Za-z0-9_-]{20,}|Bearer[[:space:]]+[A-Za-z0-9_-]{30,})' -- .; then
            echo 'Potential secret-shaped value found in a tracked file.' >&2
            exit 1
          fi

  baseline-controlled-e2e:
    name: Capture baseline controlled E2E failures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/xhs-workbench-next
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: |
          python - <<'PY'
          import subprocess, sys, tomllib
          with open('pyproject.toml', 'rb') as handle:
              project = tomllib.load(handle)
          deps = project['project']['dependencies'] + project['project']['optional-dependencies']['dev']
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *deps])
          PY
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Capture baseline Playwright result
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npx playwright test --reporter=json > e2e-report.json
          status=$?
          set -e
          python - "$status" <<'PY'
          import json
          import pathlib
          import sys

          status = int(sys.argv[1])
          report = json.loads(pathlib.Path('e2e-report.json').read_text(encoding='utf-8'))
          issues = set()

          def visit(suite):
              for spec in suite.get('specs', []):
                  failed = any(
                      result.get('status') in {'failed', 'timedOut', 'interrupted'}
                      for test in spec.get('tests', [])
                      for result in test.get('results', [])
                  )
                  if failed:
                      issues.add(
                          f"{spec.get('file')}:{spec.get('line')}:{spec.get('column')}::{spec.get('title')}"
                      )
              for child in suite.get('suites', []):
                  visit(child)

          for suite in report.get('suites', []):
              visit(suite)
          pathlib.Path('e2e-result.json').write_text(
              json.dumps({'exit_code': status, 'issues': sorted(issues)}, indent=2, ensure_ascii=False),
              encoding='utf-8',
          )
          print(f'baseline E2E: exit={status}, issues={len(issues)}')
          if status not in (0, 1):
              raise SystemExit(f'Playwright infrastructure failure: exit {status}')
          if status == 1 and not issues:
              raise SystemExit('Playwright failed but no failed test ids could be extracted')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-e2e-result
          path: frontend/e2e-result.json

  spike-controlled-e2e:
    name: Capture spike controlled E2E failures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: |
          python - <<'PY'
          import subprocess, sys, tomllib
          with open('pyproject.toml', 'rb') as handle:
              project = tomllib.load(handle)
          deps = project['project']['dependencies'] + project['project']['optional-dependencies']['dev']
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *deps])
          PY
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Capture spike Playwright result
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npx playwright test --reporter=json > e2e-report.json
          status=$?
          set -e
          python - "$status" <<'PY'
          import json
          import pathlib
          import sys

          status = int(sys.argv[1])
          report = json.loads(pathlib.Path('e2e-report.json').read_text(encoding='utf-8'))
          issues = set()

          def visit(suite):
              for spec in suite.get('specs', []):
                  failed = any(
                      result.get('status') in {'failed', 'timedOut', 'interrupted'}
                      for test in spec.get('tests', [])
                      for result in test.get('results', [])
                  )
                  if failed:
                      issues.add(
                          f"{spec.get('file')}:{spec.get('line')}:{spec.get('column')}::{spec.get('title')}"
                      )
              for child in suite.get('suites', []):
                  visit(child)

          for suite in report.get('suites', []):
              visit(suite)
          pathlib.Path('e2e-result.json').write_text(
              json.dumps({'exit_code': status, 'issues': sorted(issues)}, indent=2, ensure_ascii=False),
              encoding='utf-8',
          )
          print(f'spike E2E: exit={status}, issues={len(issues)}')
          if status not in (0, 1):
              raise SystemExit(f'Playwright infrastructure failure: exit {status}')
          if status == 1 and not issues:
              raise SystemExit('Playwright failed but no failed test ids could be extracted')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: spike-e2e-result
          path: frontend/e2e-result.json

  e2e-regression-guard:
    name: Controlled E2E regression guard
    needs: [baseline-controlled-e2e, spike-controlled-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: baseline-e2e-result
          path: baseline
      - uses: actions/download-artifact@v4
        with:
          name: spike-e2e-result
          path: spike
      - name: Fail only on newly failing E2E tests
        run: |
          python - <<'PY'
          import json
          import pathlib

          baseline = json.loads(pathlib.Path('baseline/e2e-result.json').read_text(encoding='utf-8'))
          spike = json.loads(pathlib.Path('spike/e2e-result.json').read_text(encoding='utf-8'))
          baseline_issues = set(baseline['issues'])
          spike_issues = set(spike['issues'])
          new = sorted(spike_issues - baseline_issues)
          fixed = sorted(baseline_issues - spike_issues)

          print(f"baseline E2E issues: {len(baseline_issues)}")
          print(f"spike E2E issues:    {len(spike_issues)}")
          print(f"new E2E issues:      {len(new)}")
          print(f"fixed E2E issues:    {len(fixed)}")
          if new:
              print('\nNEW E2E regressions:')
              print('\n'.join(f'  - {item}' for item in new))
              raise SystemExit(1)
          PY
