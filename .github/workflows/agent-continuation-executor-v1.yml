name: Durable Agent Continuation Executor V1 Verification

on:
  pull_request:
    branches:
      - spike/react-agent-workbench-actions-v1
    paths:
      - 'frontend/src/api/client.ts'
      - 'frontend/src/pages/AgentWorkbenchPage.tsx'
      - 'frontend/src/pages/AgentWorkbenchPage.test.tsx'
      - 'backend/app/api/agent_runtime.py'
      - 'backend/app/agent_runtime/continuation_executor.py'
      - 'backend/app/agent_runtime/job_continuation.py'
      - 'backend/app/agent_runtime/production_runtime.py'
      - 'backend/app/agent_runtime/workbench_actions.py'
      - 'backend/app/agent_runtime/workbench_read.py'
      - 'backend/app/main.py'
      - 'backend/app/schemas/agent_runtime.py'
      - 'backend/tests/agent_runtime/test_continuation_executor_api.py'
      - 'backend/tests/agent_runtime/test_job_bound_approved_continuation.py'
      - 'backend/tests/agent_runtime/test_workbench_operator_actions_api.py'
      - 'backend/tests/agent_runtime/test_workbench_read_api.py'
      - 'backend/tests/agent_runtime/test_workbench_projection_api_v2.py'
      - 'backend/tests/agent_runtime/test_workbench_chatgpt_handoff_api.py'
      - 'docs/architecture-knowledge/23_DURABLE_AGENT_CONTINUATION_EXECUTOR_V1.md'
      - '.github/workflows/agent-continuation-executor-v1.yml'
  workflow_dispatch:

env:
  PYTHONPATH: .

jobs:
  frontend:
    name: Durable continuation workbench frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run focused Agent workbench tests
        run: npm test -- --run src/pages/AgentWorkbenchPage.test.tsx src/main.test.tsx
      - name: Run complete frontend regression
        run: npm test -- --run
      - name: Build production frontend
        run: npm run build

  backend-contract:
    name: Durable continuation executor contract regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project dependencies
        run: |
          python - <<'PY'
          import subprocess, sys, tomllib
          with open('pyproject.toml', 'rb') as handle:
              project = tomllib.load(handle)
          deps = project['project']['dependencies'] + project['project']['optional-dependencies']['dev']
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *deps])
          PY
      - name: Compile continuation boundary
        run: python -m compileall -q backend tools frontend/e2e/fixture_app.py
      - name: Run durable continuation and workbench contracts
        run: >-
          python -m pytest
          backend/tests/agent_runtime/test_continuation_executor_api.py
          backend/tests/agent_runtime/test_job_bound_approved_continuation.py
          backend/tests/agent_runtime/test_workbench_operator_actions_api.py
          backend/tests/agent_runtime/test_workbench_read_api.py
          backend/tests/agent_runtime/test_workbench_projection_api_v2.py
          backend/tests/agent_runtime/test_workbench_chatgpt_handoff_api.py
          -q
      - name: Run complete Agent Runtime acceptance
        run: python -m pytest backend/tests/agent_runtime -q
      - name: Run application lifecycle regression
        run: >-
          python -m pytest
          backend/tests/test_jobs_hardening.py
          backend/tests/xhs/test_s2a_round1_hardening.py::test_lifespan_does_not_ignore_unsafe_xhs_close
          backend/tests/content/test_cleanup_worker.py::test_app_lifespan_worker_processes_due_cleanup
          backend/tests/shops/test_shop_service.py::test_app_lifespan_closes_shop_background_workers
          -q
      - name: Scan release boundaries
        run: python tools/scan_release_boundaries.py --root .
