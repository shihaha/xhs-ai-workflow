name: Business Journey Demand Radar V1 Verification

on:
  pull_request:
    branches:
      - spike/physical-collection-boundary-v1
    paths:
      - 'backend/app/features/business/**'
      - 'backend/app/main.py'
      - 'backend/tests/business/**'
      - 'frontend/src/api/client.ts'
      - 'frontend/src/main.tsx'
      - 'frontend/src/main.test.tsx'
      - 'frontend/src/pages/DemandRadarPage.tsx'
      - 'frontend/src/pages/DemandRadarPage.test.tsx'
      - 'frontend/src/styles.css'
      - 'frontend/e2e/demand-radar-business-surface.spec.ts'
      - 'frontend/playwright.demand-radar.config.ts'
      - 'docs/WORKBENCH_RESEARCH_INDEX.md'
      - 'docs/architecture-knowledge/12_IMPLEMENTATION_ROADMAP.md'
      - 'docs/architecture-knowledge/28_TUTORIAL_ALIGNED_BUSINESS_WORKBENCH_STANDARD.md'
      - 'docs/architecture-knowledge/29_DEMAND_RADAR_BUSINESS_SURFACE_V1.md'
      - '.github/workflows/business-journey-demand-radar-v1.yml'
  workflow_dispatch:

env:
  PYTHONPATH: .

jobs:
  backend-business-contract:
    name: Business projection and preserved authorities
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project dependencies
        run: |
          python - <<'PY'
          import subprocess, sys, tomllib
          with open('pyproject.toml', 'rb') as handle:
              project = tomllib.load(handle)
          deps = project['project']['dependencies'] + project['project']['optional-dependencies']['dev']
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *deps])
          PY
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Run Stage 7.1/7.2 business projection tests
        run: python -m pytest backend/tests/business -q
      - name: Recheck bounded Agent authority
        run: python -m pytest backend/tests/agent_runtime -q
      - name: Recheck Opportunity to Product/Content compatibility
        run: python -m pytest backend/tests/content -q
      - name: Scan release boundaries
        run: python tools/scan_release_boundaries.py --root .

  analysis-baseline-compare:
    name: Analysis regression versus Stage 6 base
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project dependencies
        run: |
          python - <<'PY'
          import subprocess, sys, tomllib
          with open('pyproject.toml', 'rb') as handle:
              project = tomllib.load(handle)
          deps = project['project']['dependencies'] + project['project']['optional-dependencies']['dev']
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *deps])
          PY
      - name: Compare Analysis failures with stacked base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          root = pathlib.Path.cwd()
          base_dir = root.parent / 'stage7-pr-base'
          subprocess.check_call(['git', 'worktree', 'add', '--detach', str(base_dir), os.environ['BASE_SHA']])

          def run_suite(cwd: pathlib.Path, report: pathlib.Path):
              completed = subprocess.run(
                  [sys.executable, '-m', 'pytest', '-q', 'backend/tests/analysis', f'--junitxml={report}'],
                  cwd=cwd,
                  check=False,
              )
              tree = ET.parse(report)
              failures = set()
              for case in tree.iter('testcase'):
                  if case.find('failure') is not None or case.find('error') is not None:
                      failures.add(f"{case.attrib.get('classname', '')}::{case.attrib.get('name', '')}")
              return completed.returncode, failures

          base_report = root / 'stage7-base-analysis.xml'
          head_report = root / 'stage7-head-analysis.xml'
          _, base_failures = run_suite(base_dir, base_report)
          _, head_failures = run_suite(root, head_report)
          new_failures = sorted(head_failures - base_failures)
          print('Base failures:', sorted(base_failures))
          print('Head failures:', sorted(head_failures))
          if new_failures:
              print('New Stage-7 Analysis failures:', new_failures)
              raise SystemExit(1)
          print('No new Analysis failures versus Stage-6 stacked base.')
          PY

  frontend-business-surface:
    name: Demand Radar desktop and mobile surface
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run focused Demand Radar and legacy opportunity tests
        run: npm test -- --run src/pages/DemandRadarPage.test.tsx src/pages/OpportunitiesPage.test.tsx src/main.test.tsx
      - name: Run complete frontend regression
        run: npm test -- --run
      - name: Build production frontend
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify desktop/mobile Demand Radar layout
        run: npx playwright test --config=playwright.demand-radar.config.ts
