name: Agent Job Binding Spike Verification

on:
  pull_request:
    branches:
      - fix/agent-runtime-foldin-v1
    paths:
      - 'backend/app/agent_runtime/job_binding.py'
      - 'backend/tests/agent_runtime/test_job_binding*.py'
      - '.github/workflows/agent-job-binding-spike.yml'
  workflow_dispatch:

env:
  PYTHONPATH: .

jobs:
  focused:
    name: Focused binding and Job authority tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project dependencies
        run: |
          python - <<'PY'
          import subprocess, sys, tomllib
          with open('pyproject.toml', 'rb') as handle:
              project = tomllib.load(handle)
          deps = project['project']['dependencies'] + project['project']['optional-dependencies']['dev']
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *deps])
          PY
      - name: Compile staged binding
        run: python -m compileall -q backend/app/agent_runtime/job_binding.py backend/tests/agent_runtime
      - name: Run Agent Job binding tests
        run: python -m pytest backend/tests/agent_runtime/test_job_binding*.py -q
      - name: Run existing Job state-machine tests
        run: python -m pytest backend/tests/test_job_state_machine.py backend/tests/test_job_batch.py -q
